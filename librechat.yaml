version: 1.2.1
registration:
  allowedDomains:
    - "abk.gr"

# ── Selectable models ────────────────────────────────────────────────────────
# NOT a setting in this file. Recorded here because this is where the rest of
# this deployment's configuration decisions are written down, and because the
# value lives only on the Azure Container App — nothing in either repository
# reproduces it, so recreating `abkagent-backup` silently restores all ten
# models unless it is set again:
#
#   az containerapp update -n abkagent-backup -g ABKAgent365 --set-env-vars \
#     "ANTHROPIC_MODELS=claude-sonnet-5,claude-opus-5,claude-haiku-4-5-20251001"
#
# getAnthropicModels() (packages/api/src/endpoints/models.ts) returns this list
# verbatim and skips its usual fetch from Anthropic, so the three named models
# are the only ones offered anywhere: the model picker, the server-side
# validateModel guard, and validateAgentModel, which all read the same list.
#
# Excluded on cost, per the September price review: Fable 5 ($10/$50) is 5x
# Sonnet 5 and was the largest exposure — a single heavy user could reach ~$299
# a month on it. The 4.x Opus models price identically to Opus 5 and differ only
# in fast mode, and Sonnet 4.5/4.6 ($3/$15) are both dearer and weaker than
# Sonnet 5 ($2/$10), so none of them has a case.
#
# The consequence to keep in mind: new Anthropic models no longer appear on
# their own. That is deliberate. A model that appears without a matching entry
# in patch.js's price table bills at LibreChat's catch-all rate — the exact
# mechanism that under-reported Sonnet 5 by ~4x for two weeks. Both lists now
# have to be edited together, which is the point.
#
# Anything set here must include the model the shared ABK Agent runs on
# (currently claude-sonnet-5). validateAgentModel rejects an agent whose model
# is absent from the list, so omitting it does not downgrade the agent — it
# makes the agent unopenable.

# Per-user token usage tracking. Every request against a real LLM API key
# (Claude/OpenAI/etc., not the Agent365 Graph tools) is logged to the
# Transactions collection regardless of the setting below — that's what
# powers both interface.contextCost/contextUsage per-message display and
# the Organization Settings "Usage" column. `enabled: false` here only
# turns off the hard per-user quota/blocking (no custom code needed either
# way, this is a native LibreChat feature) — the org's actual spend is
# already visible in the Anthropic Console, so a second, separate
# per-user token wallet that can silently block someone mid-conversation
# isn't worth the friction for a small trusted team.
balance:
  enabled: false
  startBalance: 20000        # tokens credited to a user on first login
  autoRefillEnabled: true
  refillIntervalValue: 30
  refillIntervalUnit: "days"
  refillAmount: 10000        # tokens added every refill cycle

interface:
  contextCost: true          # show the €/$ cost of each message to the user
  contextUsage: true         # show token counts (context window usage) too
  currency:
    code: EUR
    rate: 0.92                # static USD->EUR multiplier — update periodically, not live-fetched
  # LibreChat's default is share:false, public:false for agents — without this,
  # the Agent Builder "Share"/"Make public" control never appears at all, for
  # any role, because the interface-level toggle gates it before the per-agent
  # ACL system (aclEntry, PrincipalType.PUBLIC) is even reached. Agent Builder
  # itself stays admin-only via patch.js's role gating on the nav button; this
  # only turns on the sharing control for whoever already has that button.
  agents:
    use: true
    create: true
    share: true
    public: true
